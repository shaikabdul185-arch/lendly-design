<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></helmet>
<sc-if value="{{ isSearch }}" hint-placeholder-val="{{ true }}"><div style="height:52px;border-radius:26px;background:#FFFDF9;border:1.5px solid #E3D6C5;display:flex;align-items:center;gap:10px;padding:0 18px;box-sizing:border-box;font:400 16px/1 'Figtree',sans-serif"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;color:#6B5D50">search</span><sc-if value="{{ hasValue }}"><span style="color:#2B2118">{{ value }}</span></sc-if><sc-if value="{{ noValue }}"><span style="color:#6B5D50">{{ placeholder }}</span></sc-if></div></sc-if>
<sc-if value="{{ isField }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><div style="font:600 14px/1 'Figtree',sans-serif;color:#2B2118">{{ label }}</div><div style="min-height:52px;border-radius:14px;background:#FFFDF9;border:1.5px solid #E3D6C5;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;font:400 16px/1.3 'Figtree',sans-serif"><sc-if value="{{ hasIcon }}"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:#6B5D50">{{ icon }}</span></sc-if><sc-if value="{{ hasValue }}"><span style="color:#2B2118">{{ value }}</span></sc-if><sc-if value="{{ noValue }}"><span style="color:#6B5D50">{{ placeholder }}</span></sc-if></div></div></sc-if>
<sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><div style="font:600 14px/1 'Figtree',sans-serif;color:#2B2118">{{ label }}</div><div style="min-height:104px;border-radius:16px;background:#FFFDF9;border:1.5px solid #A8432A;box-shadow:0 0 0 3px #F1DCCB;padding:14px 16px;box-sizing:border-box;font:400 15px/1.45 'Figtree',sans-serif;text-wrap:pretty"><sc-if value="{{ hasValue }}"><span style="color:#2B2118">{{ value }}</span></sc-if><sc-if value="{{ noValue }}"><span style="color:#6B5D50">{{ placeholder }}</span></sc-if></div><sc-if value="{{ hasHelper }}"><div style="font:400 12px/1 'IBM Plex Mono',monospace;color:#6B5D50;align-self:flex-end">{{ helper }}</div></sc-if></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:350,&quot;height&quot;:160},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;search&quot;,&quot;field&quot;,&quot;area&quot;],&quot;default&quot;:&quot;search&quot;,&quot;tsType&quot;:&quot;'search'|'field'|'area'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What do you need to borrow?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'search';
    const v = this.props.value;
    return { isSearch: k === 'search', isField: k === 'field', isArea: k === 'area', label: this.props.label ?? '', placeholder: this.props.placeholder ?? 'What do you need to borrow?', value: v, hasValue: !!v, noValue: !v, icon: this.props.icon, hasIcon: !!this.props.icon, helper: this.props.helper, hasHelper: !!this.props.helper };
  }
}
</script>
</body>
</html>
