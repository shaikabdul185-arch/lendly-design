<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></helmet>
<div style="min-height:56px;border-radius:16px;background:#FFFDF9;box-shadow:0 0 0 1px #EDE2D3;display:flex;align-items:center;gap:14px;padding:10px 14px;box-sizing:border-box;cursor:pointer">
  <sc-if value="{{ checked }}" hint-placeholder-val="{{ true }}"><div style="width:26px;height:26px;border-radius:8px;background:#A8432A;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Material Symbols Rounded';font-size:20px;line-height:1">check</div></sc-if>
  <sc-if value="{{ unchecked }}" hint-placeholder-val="{{ false }}"><div style="width:26px;height:26px;border-radius:8px;border:2px solid #A8998A;box-sizing:border-box;flex:none"></div></sc-if>
  <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
    <div style="font:500 15px/1.3 'Figtree',sans-serif;color:#2B2118">{{ label }}</div>
    <sc-if value="{{ hasNote }}"><div style="font:400 13px/1.3 'Figtree',sans-serif;color:#6B5D50">{{ note }}</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:72},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Both batteries and charger included&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;checked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = !!this.props.checked;
    return { checked: c, unchecked: !c, label: this.props.label ?? 'Both batteries and charger included', note: this.props.note, hasNote: !!this.props.note };
  }
}
</script>
</body>
</html>
