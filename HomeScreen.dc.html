<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></helmet>
<div style="width:390px;height:844px;border-radius:48px;overflow:hidden;background:#F7F1E8;box-shadow:0 30px 60px -20px rgba(40,30,20,.35),0 0 0 10px #1E1C19;position:relative;display:flex;flex-direction:column">
  <div style="height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:600 16px/1 'Figtree',sans-serif;color:#2B2118"><span>9:41</span><span style="font-family:'Material Symbols Rounded';font-size:18px;line-height:1;letter-spacing:2px">signal_cellular_alt wifi battery_full</span></div>
  <div style="flex:1;overflow:hidden;padding:12px 16px 0;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:500 14px/1 'Figtree',sans-serif;color:#6B5D50;display:flex;align-items:center;gap:4px"><span style="font-family:'Material Symbols Rounded';font-size:18px;line-height:1">location_on</span>Maple Grove · 1 km</div>
        <div style="font:400 30px/1.1 'Young Serif',serif;color:#2B2118;white-space:nowrap">Morning, Priya</div>
      </div>
      <div style="width:44px;height:44px;border-radius:22px;background:#3E5C45;color:#FFFDF9;display:flex;align-items:center;justify-content:center;font:600 16px/1 'Figtree',sans-serif">PS</div>
    </div>
    <dc-import name="Input" kind="search" placeholder="What do you need to borrow?" hint-size="100%,52px"></dc-import>
    <div style="display:flex;gap:8px;overflow:hidden;margin-right:-16px">
      <dc-import name="Chip" label="All nearby" selected="{{ true }}" hint-size="110px,44px"></dc-import>
      <dc-import name="Chip" label="Power tools" hint-size="120px,44px"></dc-import>
      <dc-import name="Chip" label="Garden" hint-size="90px,44px"></dc-import>
      <dc-import name="Chip" label="Camping" hint-size="100px,44px"></dc-import>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px">
      <div style="font:400 21px/1 'Young Serif',serif;color:#2B2118">On your street</div>
      <div style="font:600 14px/1 'Figtree',sans-serif;color:#A8432A">See map</div>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px">
      <dc-import name="ItemCard" title="Cordless drill, 18V" meta="0.4 km · Marcus T." icon="handyman" tone="terra" status="available" hint-size="100%,232px"></dc-import>
      <dc-import name="ItemCard" title="Step ladder, 6 ft" meta="0.7 km · Ana R." icon="stairs" tone="pine" status="borrowed" status-label="Back Oct 4" hint-size="100%,232px"></dc-import>
      <dc-import name="ItemCard" title="4-person dome tent" meta="1.1 km · The Okafors" icon="camping" tone="pine" status="available" hint-size="100%,232px"></dc-import>
      <dc-import name="ItemCard" title="Sewing machine, walking foot" meta="1.3 km · June L." icon="content_cut" tone="terra" status="available" hint-size="100%,232px"></dc-import>
    </div>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:22px"><dc-import name="BottomNav" active="home" hint-size="100%,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:410,&quot;height&quot;:864}}"></script>
</body>
</html>
