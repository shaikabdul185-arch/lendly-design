<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></helmet>
<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}"><div style="background:#FFFDF9;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #EDE2D3,0 2px 0 #E3D6C5;cursor:pointer">
  <sc-if value="{{ terra }}" hint-placeholder-val="{{ true }}"><div style="height:112px;background:#F1DCCB;color:#A8432A;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Rounded';font-size:44px;line-height:1">{{ icon }}</div></sc-if>
  <sc-if value="{{ pine }}" hint-placeholder-val="{{ false }}"><div style="height:112px;background:#E2E6D6;color:#3E5C45;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Rounded';font-size:44px;line-height:1">{{ icon }}</div></sc-if>
  <div style="padding:12px 12px 14px;display:flex;flex-direction:column;gap:7px">
    <div style="font:600 15px/1.25 'Figtree',sans-serif;color:#2B2118;text-wrap:pretty">{{ name }}</div>
    <div style="font:400 12px/1.2 'IBM Plex Mono',monospace;color:#6B5D50">{{ meta }}</div>
    <div style="display:flex"><dc-import name="Badge" status="{{ status }}" label="{{ statusLabel }}" hint-size="90px,24px"></dc-import></div>
  </div>
</div></sc-if>
<sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}"><div style="background:#FFFDF9;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1px #EDE2D3,0 2px 0 #E3D6C5">
  <div style="display:flex;gap:14px;align-items:center">
    <sc-if value="{{ terra }}"><div style="width:64px;height:64px;border-radius:14px;background:#F1DCCB;color:#A8432A;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Material Symbols Rounded';font-size:32px;line-height:1">{{ icon }}</div></sc-if>
    <sc-if value="{{ pine }}"><div style="width:64px;height:64px;border-radius:14px;background:#E2E6D6;color:#3E5C45;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Material Symbols Rounded';font-size:32px;line-height:1">{{ icon }}</div></sc-if>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
      <div style="font:600 16px/1.25 'Figtree',sans-serif;color:#2B2118">{{ name }}</div>
      <div style="font:400 12px/1.2 'IBM Plex Mono',monospace;color:#6B5D50">{{ meta }}</div>
      <div style="display:flex"><dc-import name="Badge" status="{{ status }}" label="{{ statusLabel }}" hint-size="90px,24px"></dc-import></div>
    </div>
  </div>
  <sc-if value="{{ hasAction }}"><dc-import name="Button" variant="{{ actionVariant }}" label="{{ actionLabel }}" icon="{{ actionIcon }}" style="width:100%;height:44px" hint-size="100%,44px"></dc-import></sc-if>
</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:175,&quot;height&quot;:240},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;row&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid'|'row'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cordless drill, 18V&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0.4 km · Marcus T.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;handyman&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;terra&quot;,&quot;pine&quot;],&quot;default&quot;:&quot;terra&quot;,&quot;tsType&quot;:&quot;'terra'|'pine'&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;available&quot;,&quot;borrowed&quot;,&quot;overdue&quot;],&quot;default&quot;:&quot;available&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statusLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;disabled&quot;],&quot;default&quot;:&quot;secondary&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tone = p.tone ?? 'terra';
    return {
      isGrid: (p.layout ?? 'grid') === 'grid', isRow: p.layout === 'row',
      terra: tone === 'terra', pine: tone === 'pine',
      icon: p.icon ?? 'handyman', name: p.title ?? 'Cordless drill, 18V', meta: p.meta ?? '0.4 km · Marcus T.',
      status: p.status ?? 'available', statusLabel: p.statusLabel,
      hasAction: !!p.actionLabel, actionLabel: p.actionLabel, actionVariant: p.actionVariant ?? 'secondary', actionIcon: p.actionIcon
    };
  }
}
</script>
</body>
</html>
