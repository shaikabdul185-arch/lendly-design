<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></helmet>
<sc-if value="{{ isAvailable }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:#DCE8DA;color:#2F4A36;font:600 12px/1 'Figtree',sans-serif;white-space:nowrap"><span style="width:6px;height:6px;border-radius:3px;background:#3E7A4C;flex:none"></span>{{ label }}</span></sc-if>
<sc-if value="{{ isBorrowed }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:#F5E2C4;color:#7A4A12;font:600 12px/1 'Figtree',sans-serif;white-space:nowrap"><span style="width:6px;height:6px;border-radius:3px;background:#C27A1E;flex:none"></span>{{ label }}</span></sc-if>
<sc-if value="{{ isOverdue }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:#F8D9D4;color:#8E1F17;font:700 12px/1 'Figtree',sans-serif;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">schedule</span>{{ label }}</span></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;available&quot;,&quot;borrowed&quot;,&quot;overdue&quot;],&quot;default&quot;:&quot;available&quot;,&quot;tsType&quot;:&quot;'available'|'borrowed'|'overdue'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Available&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status ?? 'available';
    const def = { available: 'Available', borrowed: 'Borrowed', overdue: 'Overdue' };
    return { isAvailable: s === 'available', isBorrowed: s === 'borrowed', isOverdue: s === 'overdue', label: this.props.label ?? def[s] };
  }
}
</script>
</body>
</html>
